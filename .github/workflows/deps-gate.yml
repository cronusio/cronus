name: Dependency Build Gate

# Compile-checks the workspace whenever a dependency manifest, lockfile or
# source file changes — the guard that turns a silent "manifest bumped, code no
# longer builds against the new API" into a red check. Triggered by
# dependency-bump PRs (Dependabot), by any direct edit to a manifest/lockfile,
# and by changes under the code directories: a gate that only watched manifests
# never built the workspace for an ordinary code change.
#
# The structural boundary guard is its own job. It used to be the first step of
# the build job, so one red guard skipped build, lint and test entirely and the
# workspace went unverified in CI for six weeks without anyone noticing.

on:
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "crates/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deps-gate.yml"
      - "scripts/check-domain-boundary.mjs"
      - "scripts/domain-io-baseline.json"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "crates/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deps-gate.yml"
      - "scripts/check-domain-boundary.mjs"
      - "scripts/domain-io-baseline.json"

permissions:
  contents: read

concurrency:
  group: deps-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Structural gate: cronus-domain must never gain a dependency outside its
  # allowlist (the allowlist and `l2-crate-topology` §4.3 are one fact). Cheap
  # and manifest-only. A separate job on purpose: a red guard must be visible
  # as its own failure without hiding whether the workspace still builds.
  boundary:
    name: domain dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup auto-installs the channel + components pinned in
      # rust-toolchain.toml on the first cargo invocation below.
      - name: Show pinned toolchain
        run: rustup show

      - name: Domain dependency boundary guard
        run: node scripts/check-domain-boundary.mjs

      # Prove the guard's rejection path still works (real tree clean AND an
      # injected domain->model-local edge is flagged) — a guard that cannot
      # fail protects nothing.
      - name: Boundary guard self-test
        run: node scripts/check-domain-boundary.mjs --self-test

  cargo:
    name: cargo build (workspace, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # --all-targets also compiles the benches; --locked catches manifest ↔
      # lockfile drift introduced by a bump. This is the primary gate: it is
      # the step that would have caught the aes-gcm 0.10 → 0.11 API break.
      - name: Build workspace (all targets, locked)
        run: cargo build --workspace --all-targets --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  pnpm:
    name: pnpm install (frozen lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if a package.json bump was not reflected in
      # pnpm-lock.yaml (or vice versa) — the JS analogue of --locked.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
