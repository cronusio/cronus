packages:
  - "packages/*"
  - "apps/*"

# Single source of truth for versions shared across packages/ui and apps/desktop.
# Each package references these with the `catalog:` protocol, so a version can
# never drift between the shared UI library and the app that consumes it.
catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: ^8.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1

minimumReleaseAgeExclude:
  - vite@8.3.0
  - '@fallow-cli/darwin-arm64@3.24.1 || 3.27.0 || 3.28.0'
  - '@fallow-cli/darwin-x64@3.24.1 || 3.27.0 || 3.28.0'
