id = "workflow-scaffold-hyphenated-name-never-validates"

[[step]]
argv = ["workflow", "scaffold", "my-first-flow"]
expect_exit = 0

[[step]]
argv = ["workflow", "validate", "my-first-flow.nodus"]
expect_exit = 1

[[step]]
argv = ["workflow", "validate", "my-first-flow.nodus"]
expect_exit = 1

[[step]]
argv = ["workflow", "scaffold", "simpleflow"]
expect_exit = 0

[[step]]
argv = ["workflow", "validate", "simpleflow.nodus"]
expect_exit = 0

[[step]]
argv = ["workflow", "run", "simpleflow.nodus"]
expect_exit = 1

[[step]]
argv = ["workflow", "run", "simpleflow.nodus", "--input", "{\"query\":\"hello\"}"]
expect_exit = 0

