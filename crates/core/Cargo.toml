[package]
name = "cronus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cronus-auth-local = { workspace = true }
cronus-codegraph = { workspace = true }
cronus-contract = { workspace = true }
cronus-domain = { workspace = true }
cronus-store-local = { workspace = true }
cronus-model-local = { workspace = true }
cronus-activation-os = { workspace = true }
# The facade hosts the nodus↔InferenceBackend bridge (§4.1):
# core depends on nodus to implement its `ModelProvider`, and on model-local to
# call the transport — nodus itself gains no dependency (LP-1 preserved).
nodus = { workspace = true }
serde_json = { workspace = true }
# The receipts facade (`receipts_bootstrap.rs`) reads OS entropy to birth a
# session's `ReceiptKey` — the one non-deterministic act tool-receipts needs
# (TR-5). `getrandom` is deliberately absent from cronus-domain's boundary-
# guard allowlist, so it lives here instead, the same reason cronus-auth-local
# already depends on it for secret generation.
getrandom = { workspace = true }
# The diagnostic log (`diagnostics`): events are emitted through the `tracing`
# facade, formatted by `tracing-subscriber`, and written through
# `tracing-appender`'s non-blocking worker over an in-house size-rotating
# writer (the library's own appender rotates by calendar time, not size).
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Benchmarks use a std-only timing harness (no external bench crate — see the
# dependency policy). Each bench target is a plain `fn main()` gated behind
# `harness = false`, timed with `std::time::Instant` + `std::hint::black_box`.
[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "model_router"
harness = false
