[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/contract",
    "crates/domain",
    "crates/store-local",
    "crates/auth-local",
    "crates/model-local",
    "crates/activation-os",
    "crates/codegraph",
    "crates/nodus",
    "crates/cli",
    "crates/tui",
    "crates/conformance",
    "crates/simulation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = ""
repository = "https://github.com/teratron/cronus"
homepage = "https://github.com/teratron/cronus"
documentation = "https://teratron.github.io/cronus"
readme = "README.md"

[workspace.dependencies]
cronus-codegraph = { path = "crates/codegraph" }
cronus-core = { path = "crates/core" }
cronus-contract = { path = "crates/contract" }
cronus-domain = { path = "crates/domain" }
cronus-conformance = { path = "crates/conformance" }
cronus-simulation = { path = "crates/simulation" }
cronus-tui = { path = "crates/tui" }
cronus-store-local = { path = "crates/store-local" }
cronus-auth-local = { path = "crates/auth-local" }
cronus-model-local = { path = "crates/model-local" }
cronus-activation-os = { path = "crates/activation-os" }
nodus = { path = "crates/nodus" }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
bcrypt = "0.19.3"
blake3 = "1.8.7"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
cron = "0.17.0"
crossterm = "0.29.0"
getrandom = "0.4.3"
hmac = "0.13.0"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6+spec-1.1.0"
sha1 = "0.11.0"
sqlite-vec = "0.1.9"
